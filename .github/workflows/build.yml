name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Один и тот же debug-ключ между сборками, если секреты подписи не заданы.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Проверка контента и логики
        run: ./gradlew :app:testDebugUnitTest --tests 'app.erudit.ContentValidationTest' --tests 'app.erudit.LogicTest' --tests 'app.erudit.AnswerMatcherTest' --tests 'app.erudit.CountriesTest'

      - name: Сборка release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Переименование
        run: cp app/build/outputs/apk/release/app-release.apk Erudit-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Erudit-${{ github.run_number }}
          path: Erudit-${{ github.run_number }}.apk

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Эрудит, сборка ${{ github.run_number }}
          body: |
            Автоматическая сборка из ветки `${{ github.ref_name }}` (коммит ${{ github.sha }}).
            Скачайте APK ниже и установите на Android 8.0+. Обновления ставятся поверх предыдущей версии без потери прогресса.
          make_latest: true
          files: Erudit-${{ github.run_number }}.apk
